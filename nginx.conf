events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;
    
    upstream backend_api {
        server backend:5000;
    }
    
    upstream admin_dashboard {
        server host.docker.internal:3000; # Assuming Next.js runs outside or in another container
    }
    
    upstream editor_portal {
        server host.docker.internal:3001; # Assuming Editor runs on 3001
    }

    server {
        listen 80;
        server_name api.orbit.com admin.orbit.com editor.orbit.com;
        
        # Certbot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect HTTP to HTTPS in production
        # location / {
        #     return 301 https://$host$request_uri;
        # }
    }

    # API Server
    server {
        listen 80; # Change to 443 ssl in production
        server_name api.orbit.com;

        # ssl_certificate /etc/letsencrypt/live/api.orbit.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/api.orbit.com/privkey.pem;

        location / {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket support for Socket.IO
        location /socket.io/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Admin Dashboard
    server {
        listen 80;
        server_name admin.orbit.com;
        
        location / {
            proxy_pass http://admin_dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Editor Portal
    server {
        listen 80;
        server_name editor.orbit.com;
        
        location / {
            proxy_pass http://editor_portal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
