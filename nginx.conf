# ORBIT Platform — Nginx Reverse Proxy Configuration
# Handles: API, WebSocket, Admin Dashboard, Editor Dashboard

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ─────────────────────────────────────────────────────────────────
    log_format main '\ - \ [\] "\" '
                    '\ \ "\" '
                    '"\" "\"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ─────────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # ── Gzip ────────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Security Headers ────────────────────────────────────────────────────────
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ── Rate Limiting ───────────────────────────────────────────────────────────
    limit_req_zone \ zone=api:10m rate=30r/s;
    limit_req_zone \ zone=auth:10m rate=5r/m;

    # ── Upstream Servers ─────────────────────────────────────────────────────────
    upstream backend {
        server backend:5000;
        keepalive 32;
    }

    upstream dashboard {
        server dashboard:3000;
        keepalive 16;
    }

    upstream editor {
        server editor:3000;
        keepalive 16;
    }

    # ── Main Server Block ───────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Redirect HTTP to HTTPS in production
        # return 301 https://\System.Management.Automation.Internal.Host.InternalHost\;

        # ── Health Check ─────────────────────────────────────────────────────────
        location /health {
            proxy_pass http://backend/health;
            access_log off;
        }

        # ── API Routes ───────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade \;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host \System.Management.Automation.Internal.Host.InternalHost;
            proxy_set_header X-Real-IP \;
            proxy_set_header X-Forwarded-For \;
            proxy_set_header X-Forwarded-Proto \;
            proxy_cache_bypass \;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # ── Auth Rate Limiting ───────────────────────────────────────────────────
        location /api/auth/send-otp {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host \System.Management.Automation.Internal.Host.InternalHost;
            proxy_set_header X-Real-IP \;
            proxy_set_header X-Forwarded-For \;
        }

        # ── Webhook Routes ───────────────────────────────────────────────────────
        location /webhook/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host \System.Management.Automation.Internal.Host.InternalHost;
            proxy_set_header X-Real-IP \;
            proxy_set_header X-Forwarded-For \;
        }

        # ── Socket.IO WebSocket ──────────────────────────────────────────────────
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade \;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host \System.Management.Automation.Internal.Host.InternalHost;
            proxy_set_header X-Real-IP \;
            proxy_set_header X-Forwarded-For \;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Admin Dashboard ──────────────────────────────────────────────────────
        location /admin/ {
            proxy_pass http://dashboard/;
            proxy_http_version 1.1;
            proxy_set_header Host \System.Management.Automation.Internal.Host.InternalHost;
            proxy_set_header X-Real-IP \;
            proxy_set_header X-Forwarded-For \;
        }

        # ── Editor Dashboard ─────────────────────────────────────────────────────
        location /editor/ {
            proxy_pass http://editor/;
            proxy_http_version 1.1;
            proxy_set_header Host \System.Management.Automation.Internal.Host.InternalHost;
            proxy_set_header X-Real-IP \;
            proxy_set_header X-Forwarded-For \;
        }
    }

    # ── HTTPS Server (uncomment for production with SSL certs) ──────────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name api.orbit-quickcontent.com;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512;
    #     ssl_prefer_server_ciphers off;
    #
    #     include the location blocks above
    # }
}
