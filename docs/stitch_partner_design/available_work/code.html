<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Available Work</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<style data-purpose="custom-styles">
    body {
      background-color: #050505;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    
    .nav-safe-area {
      padding-bottom: env(safe-area-inset-bottom);
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #10B981;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 0 2px #050505;
    }

    .glass-effect {
      background: rgba(17, 17, 17, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .empty-state-card {
      background: linear-gradient(180deg, rgba(20, 20, 20, 1) 0%, rgba(10, 10, 10, 1) 100%);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body class="h-screen flex flex-col relative pb-20">
<!-- BEGIN: MainHeader -->
<header class="pt-12 pb-4 px-4 border-b border-gray-800/50 flex flex-col gap-4 sticky top-0 z-10 glass-effect">
<!-- Top Row: User Info & Actions -->
<div class="flex items-center justify-between">
<!-- User Profile -->
<div class="flex items-center gap-3">
<div class="relative">
<img alt="User Avatar" class="w-10 h-10 rounded-full object-cover border-2 border-gray-800" src="https://lh3.googleusercontent.com/aida-public/AB6AXuALcRoGHqyHFh6TyCJd_J232qrpTv39MMzw4ZoNYqp2vF-_XvWEcxUA1ASHn4wRn3D0CgFa284wc8QrEwrKs3btBb2SeQwsdeZmWzR0s9x7k7q765O8VuebrglY5egvrGkW_5TBqmk0fbJPT3UmwnWq4H2RA1tB_YPw5h0b120TYxBWrOthIco-kgI0tVhgktSU1UsvLh91ovVNpSsJQsqP2OLogXj-xmmnTwD4qE1_YDHtk55606EA8X99C7DYedO_Z2T7cvGMxlEO"/>
<span class="status-dot absolute bottom-0 right-0"></span>
</div>
<div class="flex flex-col">
<div class="flex items-center gap-2">
<span class="text-xs text-gray-400 font-medium">Good evening</span>
<span class="text-[10px] bg-purple-900/40 text-purple-400 px-1.5 py-0.5 rounded uppercase font-bold border border-purple-900/60">Partner</span>
</div>
<h1 class="text-lg font-bold leading-none mt-0.5">Hi, utkarsh</h1>
</div>
</div>
<!-- Action Buttons -->
<div class="flex items-center gap-2">
<button class="w-9 h-9 rounded-full bg-gray-900 flex items-center justify-center text-gray-400 hover:text-white hover:bg-gray-800 transition-colors">
<i class="fa-solid fa-magnifying-glass text-sm"></i>
</button>
<div class="px-3 py-1.5 rounded-full bg-green-900/20 text-green-400 flex items-center gap-1.5 border border-green-900/40">
<span class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]"></span>
<span class="text-xs font-semibold">Online</span>
</div>
<button class="w-9 h-9 rounded-full bg-gray-900 flex items-center justify-center text-gray-400 hover:text-white hover:bg-gray-800 transition-colors">
<i class="fa-regular fa-bell text-sm"></i>
</button>
<button class="w-9 h-9 rounded-full bg-gray-900 flex items-center justify-center text-gray-400 hover:text-white hover:bg-gray-800 transition-colors">
<i class="fa-solid fa-chevron-down text-sm"></i>
</button>
</div>
</div>
<!-- Sub Status Banner -->
<div class="flex items-center gap-2 px-1 text-sm text-gray-400">
<i class="fa-solid fa-wallet text-green-500"></i>
<span>Ready for your next gig</span>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-1 overflow-y-auto px-4 py-6">
<!-- Section Header -->
<div class="flex items-start gap-4 mb-6">
<div class="w-10 h-10 rounded-xl bg-blue-900/20 flex items-center justify-center text-blue-400 shrink-0 border border-blue-900/40">
<i class="fa-solid fa-briefcase"></i>
</div>
<div>
<h2 class="text-xl font-bold text-white mb-1">Available Work</h2>
<p class="text-sm text-gray-400">New bookings waiting for you</p>
</div>
</div>
<!-- Empty State -->
<div class="empty-state-card rounded-2xl p-8 flex flex-col items-center justify-center text-center min-h-[300px]">
<div class="w-16 h-16 rounded-full bg-gray-900 flex items-center justify-center mb-6 shadow-inner border border-gray-800">
<i class="fa-regular fa-briefcase text-2xl text-gray-600"></i>
</div>
<h3 class="text-lg font-bold text-white mb-2">No Available Work</h3>
<p class="text-blue-300/80 text-sm mb-4">New bookings will appear here when clients book sessions.</p>
<p class="text-xs text-gray-500">Keep the app open to receive real-time notifications.</p>
</div>
</main>
<!-- END: MainContent -->
<!-- BEGIN: BottomNavigation -->
<nav class="fixed bottom-0 left-0 right-0 glass-effect border-t border-gray-800 nav-safe-area z-20 pb-2">
<!-- Active Indicator Bar -->
<div class="absolute top-0 left-4 w-12 h-0.5 bg-blue-500 rounded-b-full"></div>
<div class="flex justify-around items-end pt-3 px-2">
<!-- Home (Active) -->
<button class="flex flex-col items-center gap-1 min-w-[64px] relative group">
<div class="absolute -top-3 -left-2 w-10 h-10 rounded-full border border-gray-700 flex items-center justify-center text-gray-500 opacity-50">
<span class="font-bold font-serif text-lg">N</span>
</div>
<div class="w-8 h-8 rounded-lg bg-blue-900/30 flex items-center justify-center text-blue-400 mb-1 z-10">
<i class="fa-solid fa-table-cells-large text-lg"></i>
</div>
<span class="text-[10px] font-bold text-white z-10">Home</span>
</button>
<!-- Work -->
<button class="flex flex-col items-center gap-1 min-w-[64px] text-gray-500 hover:text-gray-300 transition-colors">
<div class="w-8 h-8 flex items-center justify-center mb-1">
<i class="fa-solid fa-briefcase text-lg"></i>
</div>
<span class="text-[10px] font-medium">Work</span>
</button>
<!-- Earnings -->
<button class="flex flex-col items-center gap-1 min-w-[64px] text-gray-500 hover:text-gray-300 transition-colors relative">
<!-- Notification Dot -->
<span class="absolute top-0 right-3 w-2 h-2 rounded-full bg-green-500"></span>
<div class="w-8 h-8 flex items-center justify-center mb-1">
<i class="fa-solid fa-wallet text-lg"></i>
</div>
<span class="text-[10px] font-medium">Earnings</span>
</button>
<!-- Profile -->
<button class="flex flex-col items-center gap-1 min-w-[64px] text-gray-500 hover:text-gray-300 transition-colors">
<div class="w-8 h-8 flex items-center justify-center mb-1">
<img alt="Profile" class="w-6 h-6 rounded-full opacity-60" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBKHsxVrVAApJBOERDf8mc7sSxWUtPB368cmGfFCj8Vp56zSNC0S-9aMKA33aPPxAJ9gUOYkN8sjach1oqPUdNAothEmtPzgS4Q22rkAUwxJlXFavjKi_k5Lbs1bMIoQwcETTUetTZ7IbKA71JyeliyTg2IQLf6gXujv-uM3GjAtpCxwN3JnxwG0So8H5p4rzNEDTP_RYvsqUQEtQWSonRLcKZfsVlR2zurm6JVc-ZITRdSntNnpcK9DFEM-XLMGqtpCZIcN-m7VhC2"/>
</div>
<span class="text-[10px] font-medium">Profile</span>
</button>
</div>
</nav>
<!-- END: BottomNavigation -->
</body></html>
