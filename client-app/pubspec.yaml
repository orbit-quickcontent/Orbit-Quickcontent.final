name: client_app
description: ORBIT Client App — Hyperlocal Professional Video Marketplace

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State Management
  flutter_riverpod: ^2.5.1

  # HTTP & API
  dio: ^5.6.0
  http: ^1.2.0

  # Socket.IO
  socket_io_client: ^2.0.3+1

  # Secure Storage (JWT)
  flutter_secure_storage: ^9.2.2

  # Maps
  maplibre_gl: ^0.21.0

  # Location
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Payments
  razorpay_flutter: ^1.3.6

  # Firebase (FCM)
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0

  # Local Notifications
  flutter_local_notifications: ^17.2.2

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  pin_code_fields: ^8.0.1

  # Image
  image_picker: ^1.1.2

  # Utilities
  intl: '>=0.19.0 <1.0.0'
  uuid: ^4.4.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.1.2
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/
