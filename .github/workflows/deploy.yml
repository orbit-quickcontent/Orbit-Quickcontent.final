name: Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:


jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test
      - name: Upload coverage
        uses: codecov/codecov-action@v3

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: |
          docker compose build backend worker frontend editor
      - name: Push to registry
        if: "${{ env.DOCKER_PASSWORD != '' }}"
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker compose push backend worker frontend editor

  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/develop' && secrets.STAGING_VPS_HOST != ''
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_VPS_HOST }}
          username: ${{ secrets.STAGING_VPS_USER }}
          key: ${{ secrets.STAGING_VPS_SSH_KEY }}
          script: |
            cd /opt/orbit-staging
            git pull origin develop
            docker compose -f docker-compose.staging.yml down
            docker compose -f docker-compose.staging.yml up -d
            docker system prune -f

  run-e2e-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run E2E tests on staging
        run: |
          npm run test:e2e:staging
        env:
          STAGING_URL: https://staging.orbit-quickcontent.com

  deploy-production:
    needs: [build]
    if: github.ref == 'refs/heads/main' && secrets.PRODUCTION_VPS_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_VPS_HOST }}
          username: ${{ secrets.PRODUCTION_VPS_USER }}
          key: ${{ secrets.PRODUCTION_VPS_SSH_KEY }}
          script: |
            cd /opt/orbit-production
            git pull origin main
            docker compose down
            docker compose up -d
            docker system prune -f
      - name: Health check
        run: |
          curl -f https://api.orbit-quickcontent.com/health || exit 1

