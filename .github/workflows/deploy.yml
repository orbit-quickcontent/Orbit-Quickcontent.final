name: Orbit CI/CD

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        
      - name: Type Check
        run: npm run type-check

      - name: Test Backend
        run: |
          cd backend
          npm test

  deploy-staging:
    needs: test-and-build
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Deploy to Staging via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/orbit/staging
            git pull origin staging
            docker-compose -f docker-compose.staging.yml up -d --build backend worker

  deploy-production:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Deploy to Production via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/orbit/production
            git pull origin main
            docker-compose up -d --build backend worker

  build-flutter-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Client APK
        run: |
          cd client-app
          flutter pub get
          flutter build apk --release

      - name: Build Partner APK
        run: |
          cd partner-app
          flutter pub get
          flutter build apk --release

      - name: Upload Client APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-client-apk
          path: client-app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Partner APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-partner-apk
          path: partner-app/build/app/outputs/flutter-apk/app-release.apk

  build-web-apps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Editor Web App
        run: |
          cd editor-web-app
          npm run build

      - name: Build Dashboard Web App
        run: |
          cd dashboard-web-app
          npm run build

      - name: Upload Editor Web App Build
        uses: actions/upload-artifact@v4
        with:
          name: orbit-editor-web-build
          path: editor-web-app/.next

      - name: Upload Dashboard Web App Build
        uses: actions/upload-artifact@v4
        with:
          name: orbit-dashboard-web-build
          path: dashboard-web-app/.next
