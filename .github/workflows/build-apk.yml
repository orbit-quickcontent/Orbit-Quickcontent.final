name: Build & Release APKs (Client & Partner)

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apks:
    name: Build & Release Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      # --- Client App ---
      - name: Install Client Dependencies
        working-directory: ./client-app
        run: flutter pub get

      - name: Build Client Release APK
        working-directory: ./client-app
        run: flutter build apk --release --build-number=${{ github.run_number }} --android-skip-build-dependency-validation --no-tree-shake-icons

      - name: Prepare Client APK
        run: |
          mkdir -p release-apks
          cp client-app/build/app/outputs/flutter-apk/app-release.apk release-apks/orbit-client-app-release.apk

      # --- Partner App ---
      - name: Install Partner Dependencies
        working-directory: ./partner-app
        run: flutter pub get

      - name: Build Partner Release APK
        working-directory: ./partner-app
        run: flutter build apk --release --build-number=${{ github.run_number }} --android-skip-build-dependency-validation --no-tree-shake-icons

      - name: Prepare Partner APK
        run: |
          cp partner-app/build/app/outputs/flutter-apk/app-release.apk release-apks/orbit-partner-app-release.apk

      # --- Artifact Uploads ---
      - name: Upload Client APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-client-app-release-apk
          path: release-apks/orbit-client-app-release.apk
          retention-days: 30

      - name: Upload Partner APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-partner-app-release-apk
          path: release-apks/orbit-partner-app-release.apk
          retention-days: 30

      # --- GitHub Release (Direct Download Links) ---
      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Orbit Release {0}', github.ref_name) || 'Orbit Latest APK Builds' }}
          body: |
            ## Orbit Mobile Applications 📱
            
            Directly download and install the latest Android APK binaries below (no login or unzipping needed):
            
            | Application | Direct Download |
            |---|---|
            | 👤 **Client App** | [Download `orbit-client-app-release.apk`](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}/orbit-client-app-release.apk) |
            | 🤝 **Partner App** | [Download `orbit-partner-app-release.apk`](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}/orbit-partner-app-release.apk) |
            
            *Automated build from commit: `${{ github.sha }}`*
          files: |
            release-apks/orbit-client-app-release.apk
            release-apks/orbit-partner-app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
