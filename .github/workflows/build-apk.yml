name: Build & Release APKs (Client & Partner)

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-client-apk:
    name: Build Client APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install Client Dependencies
        working-directory: ./client-app
        run: flutter pub get

      - name: Build Client Release APK
        working-directory: ./client-app
        run: flutter build apk --release --build-number=${{ github.run_number }} --no-tree-shake-icons

      - name: Upload Client APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-client-app-release-apk
          path: client-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-partner-apk:
    name: Build Partner APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install Partner Dependencies
        working-directory: ./partner-app
        run: flutter pub get

      - name: Build Partner Release APK
        working-directory: ./partner-app
        run: flutter build apk --release --build-number=${{ github.run_number }} --no-tree-shake-icons

      - name: Upload Partner APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-partner-app-release-apk
          path: partner-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: [build-client-apk, build-partner-apk]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download Client APK
        uses: actions/download-artifact@v4
        with:
          name: orbit-client-app-release-apk
          path: release-apks/client

      - name: Download Partner APK
        uses: actions/download-artifact@v4
        with:
          name: orbit-partner-app-release-apk
          path: release-apks/partner

      - name: Prepare Release Files
        run: |
          mkdir -p final-releases
          cp release-apks/client/app-release.apk final-releases/orbit-client-app-release.apk
          cp release-apks/partner/app-release.apk final-releases/orbit-partner-app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Orbit Release {0}', github.ref_name) || 'Orbit Latest APK Builds' }}
          body: |
            ## Orbit Mobile Applications 📱
            
            Directly download and install the latest Android APK binaries below (no login or unzipping needed):
            
            | Application | Direct Download |
            |---|---|
            | 👤 **Client App** | [Download `orbit-client-app-release.apk`](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}/orbit-client-app-release.apk) |
            | 🤝 **Partner App** | [Download `orbit-partner-app-release.apk`](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}/orbit-partner-app-release.apk) |
            
            *Automated high-speed parallel build from commit: `${{ github.sha }}`*
          files: |
            final-releases/orbit-client-app-release.apk
            final-releases/orbit-partner-app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
