name: Build APKs (Client & Partner)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-client-apk:
    name: Build Client App APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Client Dependencies
        working-directory: ./client-app
        run: flutter pub get

      - name: Build Client Release APK
        working-directory: ./client-app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload Client APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-client-app-release-apk
          path: client-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-partner-apk:
    name: Build Partner App APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Partner Dependencies
        working-directory: ./partner-app
        run: flutter pub get

      - name: Build Partner Release APK
        working-directory: ./partner-app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload Partner APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-partner-app-release-apk
          path: partner-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
