name: partner_app
description: ORBIT Partner App — Professional Videographer Platform

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State Management
  flutter_riverpod: ^2.5.1

  # HTTP & API
  dio: ^5.6.0

  # Socket.IO
  socket_io_client: ^2.0.3+1

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Maps
  maplibre_gl: ^0.21.0

  # Location (continuous background updates)
  geolocator: ^12.0.0
  background_locator_2: ^2.0.6

  # Camera
  camera: ^0.11.0+2
  video_player: ^2.9.1

  # Firebase
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  pin_code_fields: ^8.0.1
  cached_network_image: ^3.3.1

  # File upload
  path_provider: ^2.1.4

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/icon/
    - assets/splash/
    - assets/animations/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
